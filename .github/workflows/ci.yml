name: CI

# PR e main: test del server di autenticazione e della web app.
# main: immagini ghcr.io/rr2000/crypto-wallet-{auth,web} su GitHub Container Registry, :sha-<commit> e :main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  auth-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: auth-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  images:
    if: github.event_name == 'push'
    needs: [auth-server, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        part: [auth, web]
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.part == 'auth' && 'auth-server' || 'web' }}
          push: true
          tags: |
            ghcr.io/rr2000/crypto-wallet-${{ matrix.part }}:${{ steps.tag.outputs.tag }}
            ghcr.io/rr2000/crypto-wallet-${{ matrix.part }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/RR2000/crypto-wallet
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,scope=${{ matrix.part }},mode=max
