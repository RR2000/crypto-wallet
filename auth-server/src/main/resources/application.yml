server:
  port: 9000
  # the web app is served on / of the same domain, the server lives under /auth: same origin, no CORS
  servlet:
    context-path: /auth
  # behind the reverse proxy: build redirects and the issuer from X-Forwarded-*
  forward-headers-strategy: framework

spring:
  # H2 on file for local development and tests; in production PostgreSQL (WALLET_DB_URL/USER/PASSWORD)
  datasource:
    url: ${WALLET_DB_URL:jdbc:h2:file:./data/wallet}
    username: ${WALLET_DB_USER:sa}
    password: ${WALLET_DB_PASSWORD:}
  flyway:
    # portable migrations in common, the few that need a dialect in h2 / postgresql
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # the schema belongs to Flyway (db/migration)

wallet:
  # where the web app lives: OAuth redirect and logout URIs are built from here
  web-url: ${WALLET_WEB_URL:http://127.0.0.1:5173}
  # optional "Sign in with GitHub": a GitHub OAuth App with callback <server>/auth/login/oauth2/code/github
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
  # one-off copy of users and authorities from the old H2 database (e.g. jdbc:h2:file:/data/wallet), right after
  # the migrations and only if the destination is empty: see LegacyDatabaseImport
  import:
    from: ${WALLET_IMPORT_FROM:}
    username: sa
    password: ""

management:
  endpoints:
    web:
      exposure:
        include: health
