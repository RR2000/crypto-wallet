<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Crypto Wallet</title>
  <link rel="stylesheet" th:href="@{/auth.css}">
</head>
<body>
<main class="box">
  <h1>Crypto Wallet</h1>
  <p class="sub">Sign in with your email and password</p>

  <p th:if="${param.error}" class="msg error">Wrong email or password.</p>
  <p th:if="${param.logout}" class="msg ok">You have been signed out.</p>
  <p th:if="${param.registered}" class="msg ok">Account created: you can sign in now.</p>

  <form th:action="@{/login}" method="post">
    <label for="username">Email</label>
    <input type="email" id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>

  <p class="foot">No account yet? <a th:href="@{/newUser}">Create one</a></p>
  <p class="foot"><a th:href="${webUrl}">Back to the wallet</a></p>
</main>
</body>
</html>
