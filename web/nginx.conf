# La web app su /, il server di autenticazione su /auth dello stesso origin (servizio "auth" della stack).
# Davanti puo' esserci un reverse proxy con TLS: X-Forwarded-* arrivano da li', altrimenti si usano i valori locali.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # DNS di Docker: il container auth puo' ripartire con un altro IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth http://auth:9000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /auth/ {
        proxy_pass $auth;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # file con hash nel nome
    location /assets/ {
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        expires 1y;
        try_files $uri =404;
    }

    # app a pagina singola: ogni percorso sconosciuto torna a index.html
    location / {
        # la rete Ethereum si contatta dal browser: connect-src elenca il nodo RPC pubblico di Sepolia
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://ethereum-sepolia-rpc.publicnode.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
