server:
  port: 80

logging:
  level:
    root: debug

spring:
  security:
    oauth2:
      client:
        registration:
          client-a:
            provider: spring
            client-id: client-a
            client-secret: secret
            authorization-grant-type: authorization_code
            redirect-uri: "http://127.0.0.1:80/authorized"
            scope: scope-a
        provider:
          spring:
            issuer-uri: "http://127.0.0.1:9000"