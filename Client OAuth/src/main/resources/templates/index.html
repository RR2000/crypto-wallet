<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client Information</title>
    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }
        td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        th {
            background-color: #dddddd;
        }

        h1 {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 36px;
            color: #333;
            margin-bottom: 20px;
        }

        span {
            font-family: Arial, sans-serif;
            font-size: 24px;
            color: #333;
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<h1>CLIENT INFORMATION</h1>
<span th:text="${name} + '\'s Wallets'"></span>
<table>
    <tr>
        <th>My Private Keys</th>
    </tr>
    <tr th:each="wallet : ${wallets}">
        <td th:text="${wallet}"></td>
    </tr>
</table>
</body>
</html>
