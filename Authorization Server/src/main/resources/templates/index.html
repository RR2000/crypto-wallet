<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:tiles="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Authorization Server</title>
    <style>
        form {
            margin: 20px auto;
            padding: 20px;
            width: 400px;
            background-color: lightgray;
            border-radius: 10px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        input{
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: none;
        }
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: green;
            color: white;
            border-radius: 5px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h1 style="text-align: center;">Authorization Server</h1>
<h4>ADD PRIVATE KEY</h4>
<form action="#" th:action="@{/addPrivateKey}" method="post">
    <div>
        <label for="private_key">Private Key:</label>
        <input type="text" id="private_key" name="private_key" />
    </div>
    <div>
        <input type="submit" value="Submit"/>
    </div>
</form>
</body>
</html>
